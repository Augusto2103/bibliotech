<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Panel de Administración</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

<div class="w3-bar w3-teal w3-card">
    <span class="w3-bar-item"><b>CONTROL DE ADMINISTRACIÓN</b></span>
    <button class="w3-bar-item w3-button w3-right btn-logout">Salir</button>
</div>

<div class="w3-container w3-padding-32">
    <h2 class="w3-text-white">Panel de Clientes Registrados</h2>
    <p>Visualización global del sistema y limpieza de cuentas.</p>

    <div class="w3-responsive">
        <table class="w3-table w3-striped w3-bordered vault-card">
            <thead>
                <tr class="w3-dark-grey">
                    <th>ID</th>
                    <th>Username</th>
                    <th>Rol</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <!-- Contenedor dinámico poblado por admin_front_controller.js -->
            <tbody id="usersTableBody">
            </tbody>
        </table>
    </div>
</div>

<script src="../js/services/api_service.js"></script>
<script src="../js/utils/auth_helper.js"></script>
<script src="../js/components/ui_handlers.js"></script>
<script src="../js/front_controllers/admin_front_controller.js"></script>
</body>
</html>
